<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cykloplánovač</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1565c0">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

    <aside class="planner" id="planner">

        <div class="planner-header planning-only">
            <h1>Cykloplánovač</h1>
            <button id="togglePlannerBtn" class="btn btn-icon" type="button"
                    aria-expanded="true" aria-controls="plannerBody"
                    title="Sbalit / rozbalit panel">▾</button>
        </div>

        <div class="planner-body" id="plannerBody">

            <dl class="points planning-only">
                <div class="point-row">
                    <dt>Start</dt>
                    <dd id="startInfo">nenastaven</dd>
                </div>
                <div class="point-row">
                    <dt>Cíl</dt>
                    <dd id="finishInfo">nenastaven</dd>
                </div>
            </dl>

            <div class="btn-grid planning-only">
                <button id="calcBtn" class="btn btn-primary wide" type="button" disabled>Vypočítat trasu</button>
                <button id="startNavBtn" class="btn btn-go" type="button" disabled>Spustit navigaci</button>
                <button id="newRouteBtn" class="btn" type="button">Nová trasa</button>
            </div>

            <p id="hint" class="hint planning-only"></p>

            <div id="routeSummary" class="route-summary planning-only" hidden>
                <div>Vzdálenost: <strong id="routeDistance">–</strong></div>
                <div>Odhadovaný čas: <strong id="routeTime">–</strong></div>
            </div>

            <section class="nav-card nav-only" aria-label="Aktuální pokyn">
                <div class="nav-main">
                    <div id="maneuverIcon" class="nav-icon" aria-hidden="true">↑</div>
                    <div class="nav-main-text">
                        <div id="maneuverDistance" class="nav-distance">–</div>
                        <div id="maneuverText" class="nav-text">Čekám na GPS…</div>
                    </div>
                </div>
                <div class="nav-stats">
                    <span>Do cíle: <b id="remainingDistance">–</b></span>
                    <span>Čas: <b id="remainingTime">–</b></span>
                    <span>Od trasy: <b id="offRouteDistance">–</b></span>
                    <span>GPS <b id="gpsAccuracy">–</b></span>
                </div>
                <div id="navigationStatus" class="nav-status" role="status" aria-live="polite">Navigace běží</div>
                <button id="stopNavBtn" class="btn btn-stop" type="button" hidden>Ukončit navigaci</button>
            </section>

            <label class="voice-row">
                <input type="checkbox" id="voiceToggle" checked>
                <span>Hlasové pokyny</span>
            </label>

            <p id="message" class="message planning-only" role="status" aria-live="polite" hidden></p>

        </div>
    </aside>

    <main class="map-wrap">
        <div id="map"></div>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker se nezaregistroval', e); });
    });
}
</script>
</body>
</html>
